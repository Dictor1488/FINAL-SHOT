name: Dispatch INQ Final Shot v0.2.1

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v0.2.1 release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" --ref main -f version=0.2.1
